version: "2"

linters:
  default: standard

  settings:
    errcheck:
      check-blank: true # assignment to blank identifier: `_ := someFunc()`.
    govet:
      # The `inline` analyzer is not part of `go vet`; it only fires here because
      # the local toolchain's stdlib is newer than this module's `go` directive.
      disable:
        - inline

formatters:
  enable:
  - goimports